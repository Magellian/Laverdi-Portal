<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Command Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 5px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .card-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header h2 {
            color: #333;
            font-size: 1.3em;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .agent-item, .task-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .agent-item:last-child, .task-item:last-child {
            border-bottom: none;
        }
        
        .agent-info, .task-info {
            flex: 1;
        }
        
        .agent-id, .task-id {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .agent-url, .task-meta {
            font-size: 12px;
            color: #999;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-processing {
            background: #e2e3e5;
            color: #383d41;
        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .task-form {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            width: 100%;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .button-secondary {
            background: #6c757d;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        
        .logs {
            background: #1e1e1e;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        
        .log-time {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 OpenClaw Command Center</h1>
            <p class="subtitle">Manage agents, send tasks, monitor status</p>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="agent-count">{{ total_agents }}</div>
                    <div class="stat-label">Active Agents</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="task-count">{{ total_tasks }}</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completed-count">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="failed-count">0</div>
                    <div class="stat-label">Failed</div>
                </div>
            </div>
        </header>
        
        <div class="content">
            <!-- Agents Panel -->
            <div class="card">
                <div class="card-header">
                    <h2>📡 Agents</h2>
                    <button class="refresh-btn" onclick="refreshAgents()">Refresh</button>
                </div>
                <div class="card-body">
                    <div id="agents-list"></div>
                </div>
            </div>
            
            <!-- Task Creation Panel -->
            <div class="card">
                <div class="card-header">
                    <h2>➕ Create Task</h2>
                </div>
                <div class="card-body">
                    <div class="task-form">
                        <div class="form-group">
                            <label for="agent-select">Select Agent</label>
                            <select id="agent-select"></select>
                        </div>
                        
                        <div class="form-group">
                            <label for="task-type">Task Type</label>
                            <select id="task-type">
                                <option value="">-- Choose Task Type --</option>
                                <option value="echo">Echo Message</option>
                                <option value="system_info">System Info</option>
                                <option value="web_request">Web Request</option>
                                <option value="read_file">Read File</option>
                            </select>
                        </div>
                        
                        <div class="form-group" id="params-container" style="display: none;">
                            <label for="task-params">Parameters (JSON)</label>
                            <textarea id="task-params" placeholder='{"message": "Hello"}' rows="3"></textarea>
                        </div>
                        
                        <div class="button-group">
                            <button onclick="createTask()">Send Task</button>
                            <button class="button-secondary" onclick="clearForm()">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tasks Panel -->
        <div class="card">
            <div class="card-header">
                <h2>📋 Task History</h2>
                <button class="refresh-btn" onclick="refreshTasks()">Refresh</button>
            </div>
            <div class="card-body">
                <div id="tasks-list"></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = '/api';
        
        // Task type parameter templates
        const paramTemplates = {
            'echo': { message: 'Hello World' },
            'web_request': { url: 'https://example.com' },
            'read_file': { path: '/tmp/test.txt' },
            'system_info': {}
        };
        
        function updateParamsHint() {
            const taskType = document.getElementById('task-type').value;
            const container = document.getElementById('params-container');
            const paramsField = document.getElementById('task-params');
            
            if (taskType && taskType !== '') {
                container.style.display = 'block';
                paramsField.value = JSON.stringify(paramTemplates[taskType], null, 2);
            } else {
                container.style.display = 'none';
                paramsField.value = '';
            }
        }
        
        document.getElementById('task-type').addEventListener('change', updateParamsHint);
        
        async function refreshAgents() {
            try {
                const res = await fetch(`${API_URL}/agents`);
                const data = await res.json();
                
                const list = document.getElementById('agents-list');
                const select = document.getElementById('agent-select');
                
                if (data.agents.length === 0) {
                    list.innerHTML = '<div class="empty-state">No agents connected</div>';
                    select.innerHTML = '<option>-- No agents available --</option>';
                    return;
                }
                
                let html = '';
                select.innerHTML = '<option value="">-- Select an agent --</option>';
                
                data.agents.forEach(agent => {
                    html += `
                        <div class="agent-item">
                            <div class="agent-info">
                                <div class="agent-id">${agent.agent_id}</div>
                                <div class="agent-url">${agent.agent_url}</div>
                            </div>
                            <span class="status-badge status-online">Online</span>
                        </div>
                    `;
                    select.innerHTML += `<option value="${agent.agent_id}">${agent.agent_id}</option>`;
                });
                
                list.innerHTML = html;
                document.getElementById('agent-count').textContent = data.count;
            } catch (e) {
                console.error('Error refreshing agents:', e);
            }
        }
        
        async function refreshTasks() {
            try {
                const res = await fetch(`${API_URL}/tasks`);
                const data = await res.json();
                
                const list = document.getElementById('tasks-list');
                
                if (data.tasks.length === 0) {
                    list.innerHTML = '<div class="empty-state">No tasks yet</div>';
                    document.getElementById('task-count').textContent = '0';
                    document.getElementById('completed-count').textContent = '0';
                    document.getElementById('failed-count').textContent = '0';
                    return;
                }
                
                let html = '';
                let completed = 0, failed = 0;
                
                data.tasks.slice().reverse().forEach(task => {
                    if (task.status === 'completed') completed++;
                    if (task.status === 'failed') failed++;
                    
                    html += `
                        <div class="task-item">
                            <div class="task-info">
                                <div class="task-id">${task.task_id.substring(0, 8)}...</div>
                                <div class="task-meta">
                                    Agent: <strong>${task.agent_id}</strong> | 
                                    Type: <strong>${task.type}</strong> | 
                                    Created: <strong>${new Date(task.created_at).toLocaleTimeString()}</strong>
                                </div>
                                ${task.result ? `<div class="task-meta" style="color: #155724;">Result: ${JSON.stringify(task.result).substring(0, 80)}...</div>` : ''}
                                ${task.error ? `<div class="task-meta" style="color: #721c24;">Error: ${task.error}</div>` : ''}
                            </div>
                            <span class="status-badge status-${task.status}">${task.status}</span>
                        </div>
                    `;
                });
                
                list.innerHTML = html;
                document.getElementById('task-count').textContent = data.count;
                document.getElementById('completed-count').textContent = completed;
                document.getElementById('failed-count').textContent = failed;
            } catch (e) {
                console.error('Error refreshing tasks:', e);
            }
        }
        
        async function createTask() {
            const agentId = document.getElementById('agent-select').value;
            const taskType = document.getElementById('task-type').value;
            const paramsStr = document.getElementById('task-params').value;
            
            if (!agentId || !taskType) {
                alert('Please select an agent and task type');
                return;
            }
            
            let params = {};
            if (paramsStr) {
                try {
                    params = JSON.parse(paramsStr);
                } catch (e) {
                    alert('Invalid JSON in parameters');
                    return;
                }
            }
            
            try {
                const res = await fetch(`${API_URL}/tasks/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_id: agentId,
                        type: taskType,
                        params: params
                    })
                });
                
                const data = await res.json();
                if (res.ok || res.status === 202) {
                    alert(`Task created: ${data.task_id.substring(0, 8)}...`);
                    clearForm();
                    setTimeout(refreshTasks, 1000);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (e) {
                alert('Error creating task: ' + e);
            }
        }
        
        function clearForm() {
            document.getElementById('agent-select').value = '';
            document.getElementById('task-type').value = '';
            document.getElementById('task-params').value = '';
            document.getElementById('params-container').style.display = 'none';
        }
        
        // Initial load
        refreshAgents();
        refreshTasks();
        
        // Auto-refresh every 5 seconds
        setInterval(refreshAgents, 5000);
        setInterval(refreshTasks, 5000);
    </script>
</body>
</html>
