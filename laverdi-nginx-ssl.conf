# Laverdi Portal - HTTPS with SSL
server {
    listen 80;
    server_name app.laverdi.tech;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.laverdi.tech;
    
    ssl_certificate /etc/letsencrypt/live/app.laverdi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.laverdi.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    client_max_body_size 100M;
    
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# OpenClaw Agent Instance - HTTPS with WebSocket support
server {
    listen 80;
    server_name agent.laverdi.tech;
    
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name agent.laverdi.tech;
    
    ssl_certificate /etc/letsencrypt/live/app.laverdi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.laverdi.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    client_max_body_size 100M;
    
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pass correct headers for HTTPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Override origin to localhost so OpenClaw accepts it
        proxy_set_header Origin https://agent.laverdi.tech;
        
        # Timeouts for long connections
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        proxy_buffering off;
    }
}
