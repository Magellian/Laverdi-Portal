user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # HTTP - redirect everything to HTTPS
    server {
        listen 80;
        server_name laverdi.tech app.laverdi.tech agent.laverdi.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main portal: laverdi.tech
    server {
        listen 443 ssl;
        server_name laverdi.tech;

        ssl_certificate /etc/letsencrypt/live/laverdi.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/laverdi.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 100M;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # App portal: app.laverdi.tech
    server {
        listen 443 ssl;
        server_name app.laverdi.tech;

        ssl_certificate /etc/letsencrypt/live/app.laverdi.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.laverdi.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 100M;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # OpenClaw agent: agent.laverdi.tech
    server {
        listen 443 ssl;
        server_name agent.laverdi.tech;

        ssl_certificate /etc/letsencrypt/live/app.laverdi.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.laverdi.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 100M;

        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Timeouts for long WebSocket connections
            proxy_connect_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
            proxy_buffering off;
        }
    }
}
