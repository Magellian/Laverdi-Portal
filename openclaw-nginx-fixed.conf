# Nginx config for OpenClaw - with origin header rewriting

server {
    listen 9000;
    server_name _;
    client_max_body_size 100M;

    location / {
        proxy_pass http://localhost:18789;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host localhost:18789;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CRITICAL: Override the Origin header to make OpenClaw think request is from localhost
        proxy_set_header Origin http://localhost:18789;
        
        # Timeouts
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        
        # Buffering
        proxy_buffering off;
    }
}
